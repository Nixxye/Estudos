<text x="40" y="442" font-weight="bold" fill="#b00020">t=17</text>
<text x="100" y="442" fill="#222">τ1 (prio 4) pede S1 e BLOQUEIA: S1 está com τ4. Sai da disputa pela CPU.</text>
<rect x="20" y="452" width="12" height="12" fill="#b00020"/>
<text x="40" y="464" font-weight="bold" fill="#b00020">17-20</text>
<text x="100" y="464" fill="#222">τ2 e τ3 executam (maiores que τ4, e NÃO usam S1) e impedem τ4 de terminar a seção crítica.</text>
<rect x="20" y="474" width="12" height="12" fill="#555"/>
<text x="40" y="486" font-weight="bold" fill="#555">t=19</text>
<text x="100" y="486" fill="#222">τ3 (prio 2) executa ANTES de τ4 (prio 1) porque τ4 é menor; τ1 está bloqueada, não pronta.</text>
<rect x="20" y="496" width="12" height="12" fill="#0b5394"/>
<text x="40" y="508" font-weight="bold" fill="#0b5394">20-23</text>
<text x="100" y="508" fill="#222">Só τ4 está pronta: termina a seção crítica e SOLTA S1 em t=23. Só então τ1 volta a executar.</text>
<rect x="20" y="544" width="22" height="14" fill="#fff59d" stroke="#444"/>
<text x="48" y="556" font-size="12">executando</text>
<rect x="140" y="544" width="22" height="14" fill="#ff9800" stroke="#444"/>
<text x="168" y="556" font-size="12">na seção crítica de S1</text>
<rect x="344" y="544" width="22" height="14" fill="#99cc00" stroke="#444"/>
<text x="372" y="556" font-size="12">na seção crítica de S2</text>
<rect x="548" y="544" width="22" height="14" fill="#e0e0e0" stroke="#444"/>
<text x="576" y="556" font-size="12">pronta, preemptada</text>
<rect x="724" y="544" width="22" height="14" fill="#ffcc99" stroke="#444"/>
<text x="752" y="556" font-size="12">bloqueada (S1 em uso)</text>
<text x="20" y="578" font-size="12" fill="#555">▼ liberação do job   ● fim do job   Com herança de prioridade (PIP), τ4 herdaria a prioridade 4 em t=17 e soltaria S1 em t=20 (τ1 voltaria em 20, não em 23).</text>

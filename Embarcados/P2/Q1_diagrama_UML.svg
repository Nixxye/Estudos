<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 790" width="940" height="790" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#222" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect width="940" height="790" fill="#ffffff"/>
  <text x="470" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b3d91">Prova 2022, Q1a: almofada aquecida (notação dos slides tx 14.8, 14.31, 14.41, 14.52, 14.62)</text>

  <g stroke="#222" stroke-width="1.3" fill="#fdf6e3">
    <!-- HW botao -->
    <rect x="30" y="56" width="120" height="56"/>
    <!-- ISR -->
    <rect x="230" y="56" width="140" height="56"/>
    <!-- thread Modo -->
    <rect x="380" y="190" width="220" height="60"/>
    <line x1="392" y1="190" x2="392" y2="250"/><line x1="588" y1="190" x2="588" y2="250"/>
    <!-- thread Leds -->
    <rect x="200" y="470" width="220" height="60"/>
    <line x1="212" y1="470" x2="212" y2="530"/><line x1="408" y1="470" x2="408" y2="530"/>
    <!-- thread Temp -->
    <rect x="550" y="470" width="220" height="60"/>
    <line x1="562" y1="470" x2="562" y2="530"/><line x1="758" y1="470" x2="758" y2="530"/>
    <!-- Msg classes -->
    <rect x="20" y="326" width="170" height="44"/>
    <rect x="770" y="326" width="150" height="44"/>
    <!-- HW leds/resistencia -->
    <rect x="200" y="624" width="220" height="50"/>
    <rect x="550" y="624" width="220" height="50"/>
    <!-- expiration function -->
    <rect x="20" y="430" width="170" height="46" fill="#ffffff"/>
  </g>

  <!-- filas (simbolo do slide: retangulo com divisorias a direita) -->
  <g stroke="#222" stroke-width="1.5" fill="#ffffff">
    <rect x="250" y="330" width="120" height="36"/>
    <line x1="340" y1="330" x2="340" y2="366"/><line x1="355" y1="330" x2="355" y2="366"/>
    <rect x="600" y="330" width="120" height="36"/>
    <line x1="690" y1="330" x2="690" y2="366"/><line x1="705" y1="330" x2="705" y2="366"/>
  </g>

  <!-- bandeira (event flag) -->
  <g>
    <line x1="470" y1="60" x2="470" y2="118" stroke="#000" stroke-width="2.5"/>
    <polygon points="470,60 508,72 470,86" fill="#000"/>
  </g>

  <!-- relogio (timer) -->
  <g stroke="#222" stroke-width="2" fill="#ffffff">
    <circle cx="90" cy="570" r="28"/>
    <line x1="90" y1="570" x2="90" y2="550"/>
    <line x1="90" y1="570" x2="104" y2="582"/>
  </g>

  <!-- composicao Msg - fila -->
  <g stroke="#222" stroke-width="1.3" fill="#222">
    <line x1="190" y1="348" x2="226" y2="348" fill="none"/>
    <polygon points="250,348 238,342 226,348 238,354" fill="#222"/>
    <line x1="744" y1="348" x2="770" y2="348"/>
    <polygon points="720,348 732,342 744,348 732,354" fill="#222"/>
  </g>

  <!-- setas -->
  <g stroke="#222" stroke-width="1.3" fill="none" marker-end="url(#seta)">
    <!-- botao -> ISR (IRQ) -->
    <line x1="150" y1="76" x2="230" y2="76"/>
    <!-- ISR -> botao (GPIO) -->
    <line x1="230" y1="98" x2="150" y2="98"/>
    <!-- ISR set -> flag -->
    <line x1="370" y1="90" x2="468" y2="90"/>
    <!-- Modo get -> flag -->
    <line x1="470" y1="190" x2="470" y2="122"/>
    <!-- Modo put -> filaLeds -->
    <line x1="420" y1="250" x2="320" y2="328"/>
    <!-- Modo put -> filaTemp -->
    <line x1="560" y1="250" x2="685" y2="328"/>
    <!-- Leds get -->
    <line x1="310" y1="470" x2="310" y2="368"/>
    <!-- Temp get -->
    <line x1="660" y1="470" x2="660" y2="368"/>
    <!-- expiration -> filaLeds put -->
    <line x1="150" y1="430" x2="268" y2="368"/>
    <!-- Leds activate/deactivate -> timer -->
    <line x1="200" y1="520" x2="120" y2="556"/>
    <!-- GPIO -->
    <line x1="310" y1="530" x2="310" y2="622"/>
    <line x1="660" y1="530" x2="660" y2="622"/>
  </g>
  <!-- timer -> funcao de expiracao (associated function) tracejada -->
  <line x1="90" y1="542" x2="90" y2="478" stroke="#222" stroke-width="1.3" stroke-dasharray="5,4" fill="none" marker-end="url(#seta)"/>

  <!-- textos dentro das caixas -->
  <g text-anchor="middle" fill="#111">
    <text x="90" y="80">«HW»</text><text x="90" y="98" font-weight="bold">Botão</text>
    <text x="300" y="80">«ISR»</text><text x="300" y="98" font-weight="bold">BotaoISR</text>
    <text x="490" y="215">«thread»</text><text x="490" y="235" font-weight="bold">ModoDeOperacao</text>
    <text x="310" y="495">«thread»</text><text x="310" y="515" font-weight="bold">Leds</text>
    <text x="660" y="495">«thread»</text><text x="660" y="515" font-weight="bold">ControleDeTemperatura</text>
    <text x="105" y="345">«Msg»</text><text x="105" y="362" font-weight="bold">MsgLeds {cmd, led}</text>
    <text x="845" y="345">«Msg»</text><text x="845" y="362" font-weight="bold">MsgTemp {potencia}</text>
    <text x="310" y="645">«HW»</text><text x="310" y="663" font-weight="bold">LEDs (amarelo, laranja, vermelho)</text>
    <text x="660" y="645">«HW»</text><text x="660" y="663" font-weight="bold">Resistência de aquecimento</text>
    <text x="105" y="449">«expiration_function»</text><text x="105" y="466" font-weight="bold">TimerPiscaExpira</text>
  </g>

  <!-- rotulos das setas -->
  <g fill="#111" font-style="italic">
    <text x="172" y="70">«IRQ»</text>
    <text x="170" y="114">«GPIO»</text>
    <text x="408" y="84">set</text>
    <text x="428" y="160">get (timeout 40 min)</text>
    <text x="352" y="285">put</text>
    <text x="615" y="285">put</text>
    <text x="318" y="420">get</text>
    <text x="668" y="420">get</text>
    <text x="196" y="400">put</text>
    <text x="128" y="578" font-size="11">activate / deactivate</text>
    <text x="318" y="580">«GPIO»</text>
    <text x="668" y="580">«GPIO»</text>
    <text x="196" y="342">8</text>
    <text x="750" y="342">4</text>
    <text x="96" y="506" font-size="11">«associated function»</text>
  </g>

  <!-- legendas dos objetos -->
  <g fill="#111">
    <text x="520" y="76" font-weight="bold">evBotao</text>
    <text x="520" y="92">«event flags»  bit EV_BOTAO = 0x01</text>
    <text x="260" y="324" font-weight="bold">filaLeds</text>
    <text x="610" y="324" font-weight="bold">filaTemp</text>
    <text x="90" y="618" text-anchor="middle" font-weight="bold">tmrPisca</text>
    <text x="90" y="634" text-anchor="middle" font-size="11">«timer» periódico 1 s</text>
    <text x="90" y="648" text-anchor="middle" font-size="11">(criado sem ativar)</text>
  </g>

  <!-- notas com comandos -->
  <g stroke="#222" stroke-width="1" fill="#fffbe6">
    <polygon points="20,700 440,700 440,774 20,774 20,712 32,700"/>
    <polygon points="480,700 920,700 920,774 480,774 480,712 492,700"/>
  </g>
  <g fill="#111" font-size="12">
    <text x="30" y="718" font-weight="bold">Comandos em filaLeds (ModoDeOperacao → Leds)</text>
    <text x="30" y="736">LEDS_APAGA · LEDS_ACENDE(led) · LEDS_PISCA(led)</text>
    <text x="30" y="752">LEDS_TICK (enviado pela função de expiração do timer)</text>
    <text x="30" y="768">led ∈ {AMARELO, LARANJA, VERMELHO}</text>
    <text x="490" y="718" font-weight="bold">Comandos em filaTemp (ModoDeOperacao → ControleDeTemperatura)</text>
    <text x="490" y="736">potência em %: 0 (desligado/sleep) · 30 · 60 · 100</text>
    <text x="490" y="758" font-size="11">Seta = quem executa a operação aponta para o objeto (como no slide tx 14.8).</text>
  </g>
</svg>
